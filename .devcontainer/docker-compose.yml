services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - claude-code-bashhistory:/commandhistory
      - claude-code-config:/home/vscode/.claude
    # Required by init-firewall.sh to manage iptables/ipset inside the container
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: sleep infinity
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=employme;Username=postgres;Password=postgres
      Ollama__BaseUrl: http://ollama:11434
      # Integration tests (tests/Api.Tests) create and drop a throwaway database
      # per test on this server; they never touch `employme`. Set here because
      # the container has no Docker socket, so Testcontainers cannot start its
      # own Postgres — see PostgresFixture.
      EMPLOYME_TEST_POSTGRES: Host=db;Port=5432;Database=postgres;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  db:
    image: docker.io/pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employme
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: docker.io/ollama/ollama:0.32.5
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  postgres-data:
  ollama-data:
  claude-code-bashhistory:
  claude-code-config:
