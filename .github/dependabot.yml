# Version updates land on `deps`, never on main. Each pull request merges itself
# once CI is green on that exact commit; the collected result reaches main
# through one promotion pull request that a human merges. The pipeline is the
# one the other repositories run — see docs/dependency-updates.md.
#
# Monthly, one pull request per directory for every minor and patch bump, and
# one pull request per major. Packages that must move together get their own
# group across all update types, and minor-and-patch excludes their patterns,
# so two groups never raise the same line in one scan.
#
# 99 means "no limit": everything lands on `deps`, and an update that fails CI
# stays an open pull request against that branch, where it blocks nothing.
# Omitting the key applies Dependabot's default of 5; 0 switches updates off.
#
# Dependabot security updates are switched off for this repository: they always
# target main and would bypass `deps`. security-audit.yml reports advisories.
version: 2

updates:
  # Backend. directory "/" rather than "/src/Api": Dependabot follows
  # EmployMe.sln, so a test project is picked up the day it joins the solution.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    target-branch: deps
    open-pull-requests-limit: 99
    labels: ["type/chore", "area/api"]
    commit-message:
      prefix: "build(deps)"

    # EF Core, its Npgsql provider and the pgvector mapping carry version
    # ranges on each other: the provider's major follows EF Core's, and
    # Pgvector.EntityFrameworkCore follows the provider. Bumped one at a time
    # they leave the rest below what the bumped one demands. No version cap is
    # needed: the project already targets net10.0.
    groups:
      ef-core-and-npgsql:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql*"
          - "Pgvector*"
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["Microsoft.EntityFrameworkCore*", "Npgsql*", "Pgvector*"]
        update-types: ["minor", "patch"]

    # Microsoft.AspNetCore.OpenApi 10.0.x requires Microsoft.OpenApi < 3.0.0
    # (NU1608), and with 3.x its source generator fails to compile: CS0200 on
    # IOpenApiMediaType.Example, measured on PR #21. Remove this when an
    # AspNetCore.OpenApi release accepts Microsoft.OpenApi 3.
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

  # Frontend.
  - package-ecosystem: npm
    directory: "/src/Web"
    schedule:
      interval: monthly
    target-branch: deps
    open-pull-requests-limit: 99
    labels: ["type/chore", "area/web"]
    commit-message:
      prefix: "build(deps)"

    # react, react-dom and their type packages have to share a major: a
    # react-dom bump on its own broke the build in Webdev (its PR #205).
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by the workflows in this repository.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: deps
    open-pull-requests-limit: 99
    labels: ["type/chore", "area/infra"]
    commit-message:
      prefix: "ci(actions)"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Dev Container features (.devcontainer/devcontainer.json).
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: monthly
    target-branch: deps
    open-pull-requests-limit: 99
    labels: ["type/chore", "area/infra"]
    commit-message:
      prefix: "build(devcontainer)"
