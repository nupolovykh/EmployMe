name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build inside the Dev Container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            dotnet build EmployMe.sln
            npm --prefix src/Web ci
            npm --prefix src/Web run build
