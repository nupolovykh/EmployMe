name: Build

on:
  push:
    branches: [main]
  pull_request:

# The default token is read-only; nothing here writes to the repository.
permissions:
  contents: read

# A new push to a PR supersedes the run in flight. main is never cancelled, so
# the commit that landed always has a completed check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # runCmd is a plain script: without `set -e` only its last command decides
      # the step, and a failed `dotnet build` earlier on passed as green (PR #21).
      #
      # NuGet and npm sit behind CDNs whose edge IPs rotate, while
      # init-firewall.sh allowlists only the IPs it resolved at container start.
      # A restore that lands on an unlisted edge fails with "Network is
      # unreachable" — seen on main and on Dependabot PRs. The downloads are
      # retried, refreshing the firewall's snapshot in between (CLAUDE.md).
      - name: Build inside the Dev Container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            set -e
            retry() {
              for attempt in 1 2 3; do
                "$@" && return 0
                echo "::warning::'$*' failed (attempt $attempt); refreshing the firewall allowlist"
                sudo bash .devcontainer/init-firewall.sh > /dev/null || true
              done
              return 1
            }
            retry dotnet restore EmployMe.sln
            dotnet build EmployMe.sln --no-restore
            retry npm --prefix src/Web ci
            npm --prefix src/Web run build
