name: Build

on:
  push:
    branches: [main]
  pull_request:

# The default token is read-only; nothing here writes to the repository.
permissions:
  contents: read

# A new push to a PR supersedes the run in flight. main is never cancelled, so
# the commit that landed always has a completed check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build inside the Dev Container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: dotnet build EmployMe.sln
