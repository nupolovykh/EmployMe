name: Build

on:
  push:
    branches: [main]
  pull_request:

# The default token is read-only; nothing here writes to the repository.
permissions:
  contents: read

# A new push to a PR supersedes the run in flight. main is never cancelled, so
# the commit that landed always has a completed check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build, format check, tests and lint (EM-24), all inside the Dev
      # Container so the toolchain and the compose db service are the ones a
      # developer has. The contract category is the nightly live-endpoint run
      # (contract.yml) and is excluded here: it needs the network, and Jobicy
      # is capped at one poll an hour.
      #
      # runCmd is a plain script: without `set -e` only its last command decides
      # the step, and a failed `dotnet build` earlier on passed as green (PR #21).
      #
      # NuGet and npm sit behind CDNs whose edge IPs rotate, while
      # init-firewall.sh allowlists only the IPs it resolved at container start.
      # A restore that lands on an unlisted edge fails with "Network is
      # unreachable" — seen on main and on Dependabot PRs. The downloads are
      # retried, refreshing the firewall's snapshot in between (CLAUDE.md).
      - name: Build, test and lint inside the Dev Container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            set -e
            retry() {
              for attempt in 1 2 3; do
                "$@" && return 0
                echo "::warning::'$*' failed (attempt $attempt); refreshing the firewall allowlist"
                sudo bash .devcontainer/init-firewall.sh > /dev/null || true
              done
              return 1
            }
            retry dotnet restore EmployMe.sln
            dotnet build EmployMe.sln --no-restore
            dotnet format EmployMe.sln --verify-no-changes --no-restore
            dotnet test tests/Api.Tests --no-build --filter "Category!=Contract" \
              --logger "trx;LogFileName=unit.trx" --results-directory TestResults
            retry npm --prefix src/Web ci
            npm --prefix src/Web run lint
            npm --prefix src/Web run build

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      # CI-to-Slack (EM-25): only main, only on failure, only when the webhook
      # secret exists. A red PR is already on the PR; a red main is what needs
      # to interrupt someone.
      - name: Notify Slack
        if: failure() && github.ref == 'refs/heads/main' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail --silent --show-error -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg text ":x: EmployMe build failed on main — $RUN_URL" '{text: $text}')"
