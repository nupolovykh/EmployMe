name: Sync labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  workflow_dispatch:
    inputs:
      delete-other-labels:
        description: Delete labels that are not defined in .github/labels.yml
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          # Default is additive: the old ad-hoc labels (backend, frontend, deploy,
          # and GitHub's stock set) survive so historical PRs keep theirs. Run this
          # workflow manually with the input set to true once those are retired.
          delete-other-labels: ${{ github.event_name == 'workflow_dispatch' && inputs.delete-other-labels || false }}
